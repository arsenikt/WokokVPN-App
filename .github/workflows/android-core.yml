name: Android core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'lib/core/**', 'tools/build_libbox.sh', '.github/workflows/android-core.yml']

env:
  SINGBOX_VERSION: 1.11.15

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-${{ env.SINGBOX_VERSION }}-v1
      - name: Build libbox (sing-box core for Android)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash tools/build_libbox.sh "$SINGBOX_VERSION"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.29.3", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: wokok-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
