<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<defs>
 <radialGradient id="bg" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#2a1a12"/><stop offset="1" stop-color="#0d0b0a"/></radialGradient>
 <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d1a"/><stop offset="1" stop-color="#ffc23a"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb03a"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8a94"/></marker>
</defs>
<rect width="1280" height="560" rx="28" fill="url(#bg)"/>
<text x="640" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#f5e9d8">Как это работает</text>

<rect x="24" y="112" width="500" height="330" rx="22" fill="none" stroke="#fff" stroke-opacity=".08" stroke-dasharray="6 6"/>
<text x="42" y="134" font-size="13" fill="#9a8f86" letter-spacing="2">ВАШЕ УСТРОЙСТВО</text>
<rect x="756" y="112" width="500" height="330" rx="22" fill="none" stroke="#fff" stroke-opacity=".08" stroke-dasharray="6 6"/>
<text x="774" y="134" font-size="13" fill="#9a8f86" letter-spacing="2">ОБЛАКО</text>

<!-- app -->
<rect x="48" y="156" width="210" height="150" rx="18" fill="url(#glass)" stroke="#ffb03a" stroke-opacity=".5"/>
<text x="153" y="206" text-anchor="middle" font-size="46">🥡</text>
<text x="153" y="244" text-anchor="middle" font-size="18" font-weight="800" fill="#f5e9d8">Wokok</text>
<text x="153" y="268" text-anchor="middle" font-size="12.5" fill="#cfc4ba">Windows · macOS · Android</text>
<text x="153" y="288" text-anchor="middle" font-size="12.5" fill="#9a8f86">sing-box</text>

<!-- recipes -->
<rect x="292" y="156" width="206" height="150" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".12"/>
<text x="395" y="186" text-anchor="middle" font-size="13" fill="#ffc23a" font-weight="700">РЕЦЕПТЫ</text>
<text x="310" y="218" font-size="13.5" fill="#f5e9d8">● Всё в вок</text>
<text x="310" y="244" font-size="13.5" fill="#f5e9d8">● Умный (банки напрямую)</text>
<text x="310" y="270" font-size="13.5" fill="#f5e9d8">● Только выбранное</text>
<line x1="258" y1="231" x2="292" y2="231" stroke="#ffb03a" stroke-width="3" marker-end="url(#ah)"/>

<!-- direct path -->
<rect x="48" y="336" width="450" height="84" rx="16" fill="url(#glass)" stroke="#fff" stroke-opacity=".1"/>
<text x="273" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#f5e9d8">Прямое соединение</text>
<text x="273" y="392" text-anchor="middle" font-size="13" fill="#9a8f86">Банки, госсайты и локальная сеть идут мимо туннеля</text>
<line x1="395" y1="306" x2="395" y2="334" stroke="#8a8a94" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#ag)"/>

<!-- tunnel -->
<line x1="498" y1="231" x2="756" y2="231" stroke="#ffb03a" stroke-width="4" marker-end="url(#ah)"/>
<rect x="520" y="215" width="214" height="32" rx="16" fill="url(#fire)" opacity=".9" filter="url(#glow)"/>
<text x="627" y="237" text-anchor="middle" font-size="15" font-weight="800" fill="#1b1614">🔒 Reality ⇄ SSH</text>
<text x="627" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#ffc23a">Умный щит выбирает рабочий</text>
<rect x="500" y="262" width="254" height="34" rx="17" fill="#000" fill-opacity=".45" stroke="#fff" stroke-opacity=".12"/>
<text x="627" y="284" text-anchor="middle" font-size="13" fill="#cfc4ba">👁 DPI видит: обычный HTTPS</text>

<!-- server -->
<rect x="780" y="156" width="210" height="150" rx="18" fill="url(#glass)" stroke="#ffb03a" stroke-opacity=".5"/>
<text x="885" y="206" text-anchor="middle" font-size="46">🖥</text>
<text x="885" y="244" text-anchor="middle" font-size="18" font-weight="800" fill="#f5e9d8">Ваш сервер</text>
<text x="885" y="268" text-anchor="middle" font-size="12.5" fill="#cfc4ba">Xray · Reality</text>
<text x="885" y="288" text-anchor="middle" font-size="12.5" fill="#9a8f86">wokok add / del / link</text>
<line x1="990" y1="231" x2="1030" y2="231" stroke="#ffb03a" stroke-width="4" marker-end="url(#ah)"/>
<rect x="1034" y="176" width="194" height="110" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".12"/>
<text x="1131" y="226" text-anchor="middle" font-size="40">🌍</text>
<text x="1131" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#f5e9d8">Открытый интернет</text>

<!-- ticket -->
<rect x="48" y="470" width="1180" height="56" rx="16" fill="url(#glass)" stroke="#ffc23a" stroke-opacity=".35"/>
<text x="640" y="504" text-anchor="middle" font-size="16" fill="#f5e9d8">🎟 Талон: QR или ссылка wokok:// переносит сервер между ПК, телефоном и расширением Chrome, без облака</text>
</svg>